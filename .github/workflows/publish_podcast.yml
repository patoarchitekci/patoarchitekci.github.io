name: Publish Podcast Episode

# Renders one episode page from the episode store (patoarchitekci/episodes)
# and commits it to this branch. The dispatch is the publish decision: the
# workflow renders whatever the store holds at `episodes_ref` (plan 001,
# docs/plan/001-episodes-repo-source.md). The page goes live with the next
# Cloudflare Pages build after its date — the Friday `pato publish cloudflare`.

on:
  workflow_dispatch:
    inputs:
      episode_number:
        description: 'Episode Number to Publish'
        required: true
        type: string
      episodes_ref:
        description: 'Ref of patoarchitekci/episodes to render (branch, tag or sha)'
        required: false
        default: 'main'
        type: string
      dry_run:
        description: 'Render and validate only, commit nothing'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout the episode store
        uses: actions/checkout@v6
        with:
          repository: patoarchitekci/episodes
          ref: ${{ inputs.episodes_ref }}
          token: ${{ secrets.EPISODES_TOKEN }}
          path: episodes
          sparse-checkout: data
          fetch-depth: 1

      - name: Store revision
        id: store
        run: |
          echo "sha=$(git -C episodes rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          git -C episodes log -1 --format='episodes@%h %ci %s'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render the episode
        run: |
          python scripts/publish_episode.py \
            --episode-number "${{ inputs.episode_number }}" \
            --episodes-dir episodes/data

      - name: Validate generated episode YAML front matter
        run: |
          python - <<'PY'
          import re, sys, pathlib, yaml
          ep = "${{ inputs.episode_number }}"
          path = pathlib.Path(f"content/episodes/{ep}.md")
          if not path.exists():
              sys.exit(f"Episode file not found: {path}")
          text = path.read_text(encoding="utf-8")
          m = re.match(r"^---\n(.*?)\n---", text, re.DOTALL)
          if not m:
              sys.exit(f"No YAML front matter delimited by --- found in {path}")
          try:
              yaml.safe_load(m.group(1))
          except yaml.YAMLError as e:
              sys.exit(f"Invalid YAML front matter in {path}:\n{e}")
          print(f"YAML front matter OK: {path}")
          PY

      - name: Show the change
        run: |
          git --no-pager diff --stat -- content/episodes/ static/img/
          git --no-pager diff -- "content/episodes/${{ inputs.episode_number }}.md" | head -300

      - name: Commit and Push changes
        if: ${{ !inputs.dry_run }}
        uses: EndBug/add-and-commit@v10
        with:
          add: 'content/episodes/ static/img/'
          message: 'Publish episode ${{ inputs.episode_number }} (episodes@${{ steps.store.outputs.sha }})'
          default_author: github_actions
