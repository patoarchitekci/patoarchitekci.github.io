modules:
  - number: 1
    title: "Wprowadzenie i anatomia agenta"
    description: "Co to jest agent AI? Wzorzec ReAct (Reasoning + Acting). Przegląd architektury, którą zbudujemy"
  - number: 2
    title: "Setup środowiska i OpenAI API"
    description: "Konfiguracja projektu Python, pierwsze wywołanie OpenAI API, eksploracja struktury request/response"
  - number: 3
    title: "Context Window - pamięć agenta"
    description: "Implementacja klasy ContextWindow z różnymi typami wiadomości (User, Assistant, ToolUse, ToolResult)"
  - number: 4
    title: "Function Calling / Tool Use"
    description: "Jak LLM decyduje o wywołaniu narzędzia. JSON Schema dla tool definitions. Parsowanie tool_calls"
  - number: 5
    title: "Pętla ReAct - serce agenta"
    description: "Implementacja głównej pętli agenta z rekurencyjnym wywołaniem act() i wykonywaniem narzędzi"
  - number: 6
    title: "Budowanie prawdziwych narzędzi"
    description: "Od zabawkowych przykładów do użytecznych tools: read_file, write_file, http_get, execute_sql"
  - number: 7
    title: "Error handling i graceful degradation"
    description: "Co gdy tool zawiedzie? Formatowanie błędów dla context window, retry patterns"
  - number: 8
    title: "System prompt engineering"
    description: "Jak napisać skuteczny system prompt dla agenta. Instrukcje, constrainty, tool usage guidelines"
  - number: 9
    title: "Human-in-the-Loop"
    description: "Kiedy agent powinien pytać człowieka. Tool ask_human, pause/resume workflow, approval flows"
  - number: 10
    title: "Persistencja i multi-turn"
    description: "Zapisywanie context window. JSON serialization, session management, wznowienie z dowolnego punktu"
  - number: 11
    title: "Sub-agenci - Supervisor i Pipeline"
    description: "Dwa wzorce orkiestracji: Supervisor delegujący do specjalistów oraz Pipeline z sekwencyjnym przekazywaniem"
  - number: 12
    title: "Bezpieczeństwo i limity"
    description: "Guardrails dla agentów: max iterations, tool allowlisting, sandboxing, input/output validation"
  - number: 13
    title: "Podsumowanie i Q&A"
    description: "Recap architektury, kiedy framework vs własna implementacja, kierunki rozwoju (RAG, multi-modal)"

