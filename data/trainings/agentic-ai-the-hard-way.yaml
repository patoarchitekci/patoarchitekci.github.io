# FAQ
faq:
  - question: "W jakim języku programowania będziemy pracować?"
    answer: "Gotowe przykłady i wspólne kodowanie będzie w Python. Jednak OpenAI SDK jest dostępne dla JavaScript, Python, .NET, Java i Go - wzorce są identyczne we wszystkich językach. Jeśli chcesz pisać w innym języku, nie ma problemu."
  - question: "Czy muszę mieć własne konto OpenAI?"
    answer: "Nie, klucze API do OpenAI dostarczamy na czas szkolenia."
  - question: "Czy muszę konfigurować lokalne środowisko?"
    answer: "Nie, całe szkolenie będzie prowadzone w środowisku GitHub Codespaces (w ramach darmowego limitu). Wszystkie narzędzia będą już przygotowane. Można również odpalić środowisko lokalnie."
  - question: "Czy to szkolenie o LangChain lub podobnych frameworkach?"
    answer: "Absolutnie nie. Celowo omijamy frameworki, żebyś zrozumiał jak agent działa od środka. Po tym szkoleniu będziesz mógł świadomie wybrać framework lub zbudować własne rozwiązanie."
  - question: "Czy agenda może się jeszcze zmienić?"
    answer: "Tak, to zupełnie nowe szkolenie w trakcie powstawania. Przedstawiona agenda stanowi ramę programową - szczegóły mogą ulec dopracowaniu."
  - question: "Dla kogo jest to szkolenie?"
    answer: "Dla inżynierów IT, architektów i zaawansowanych programistów, którzy chcą zrozumieć jak działają agenci AI i nauczyć się budować własne rozwiązania. Wymagane jest doświadczenie w programowaniu."
  - question: "Czy po szkoleniu zrozumiem jak działają frameworki typu LangChain?"
    answer: "Tak! Frameworki takie jak LangChain, CrewAI, AutoGen, OpenAI Agents SDK, Google ADK, Strands Agents, Pydantic AI czy LlamaIndex Agents używają tych samych wzorców - pętla ReAct, function calling, context window. Po szkoleniu będziesz wiedział co dzieje się pod maską i świadomie wybierzesz narzędzie lub zbudujesz własne."

