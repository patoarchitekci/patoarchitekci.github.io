# Treść
description:
  - "Szkolenie dla adminów, Ops i DevOps, nie dla programistów. Masz w głowie panel dla zespołu, bota na Slacka albo automatyzację, która od miesięcy czeka w kolejce do developerów? Z agentem AI zbudujesz je sam. Problem w tym, że agent bez zasad daje kod z kategorii „jakoś działa, nie ruszać”."
  - "Na warsztacie pracujesz z agentem jak inżynier, nie jak hazardzista. Najpierw plan i małe zadania w GitHub Issues. Potem test, który nie przechodzi, i minimalny kod. Lint i testy po każdej zmianie, z progami, których agent nie poluzuje. Sekrety poza kodem i poza czatem. Wdrożenie tylko przez pipeline."
  - "Budujesz wewnętrzne narzędzie dla zespołu w trzech krokach: duża funkcja od zera, mały ticket ze zmianą wymagań i dodanie AI do gotowego narzędzia. Wychodzisz z działającym, wdrożonym narzędziem i z repozytorium, które jest wzorem na kolejne: reguły dla agenta, hooki, testy harnessu i CI."
  - "Wybierasz agenta (Claude Code, OpenCode albo Codex) i stack (Python albo Go). Środowisko labu jest gotowe, więc pracujesz z agentem, a nie klikasz w konfigurację."
  - "„Wszystko na żywym organizmie: widzisz efekty swojej pracy, napotykasz prawdziwe problemy i uczysz się je rozwiązywać. Polecam gorąco :)” - Jan Szczyra"

