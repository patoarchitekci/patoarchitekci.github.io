# FAQ
faq:
  - question: "Dla kogo NIE jest to szkolenie?"
    answer: "Dla programistów, którzy już na co dzień pracują z agentem na planach, testach i hookach: znajdziesz tu głównie znane rzeczy. Nie jest też o budowaniu aplikacji z LLM w środku (RAG, własne agenty): to temat szkolenia Agentic AI the Hard Way. I nie jest no-code: czytasz i poprawiasz kod, który pisze agent."
  - question: "Jakie umiejętności wyniosę?"
    answer: "Konkretne: harness dla agenta (AGENTS.md, hooki, skille) i jego testy, plan i tickety przed kodem, test-first z agentem, praca równoległa w dwóch sesjach, sekrety poza kodem, CI/CD i wdrożenie, model AI w środku narzędzia."
  - question: "Co budujemy?"
    answer: "Wewnętrzne narzędzie dla zespołu: logowanie, baza, API i wdrożenie. Budujemy je w trzech krokach: duża funkcja od zera, mały ticket ze zmianą wymagań i dodanie AI do narzędzia."
  - question: "Którego agenta AI użyjemy?"
    answer: "Wybierasz: Claude Code, OpenCode albo Codex. Laby testujemy na wszystkich trzech. Stack też wybierasz: Python (FastAPI) albo Go."
  - question: "Czy muszę umieć programować?"
    answer: "Nie musisz być programistą. Wystarczy, że rozumiesz zmienne, pętle, funkcje i prosty endpoint HTTP."
  - question: "Czy muszę coś konfigurować?"
    answer: "Tylko trochę. Przed szkoleniem dostaniesz instrukcję krok po kroku: co zainstalować i jak przygotować środowisko. Środowisko labu przygotowujemy my."

