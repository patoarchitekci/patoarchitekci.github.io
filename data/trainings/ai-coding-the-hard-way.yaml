# FAQ
faq:
  - question: "Dla kogo NIE jest to szkolenie?"
    answer: "Dla programistów, którzy już na co dzień pracują z agentem na planach, testach i hookach: znajdziesz tu głównie znane rzeczy. Nie jest też o budowaniu aplikacji z LLM w środku (RAG, własne agenty): to temat szkolenia Agentic AI the Hard Way. I nie jest no-code: czytasz i poprawiasz kod, który pisze agent."
  - question: "Jakie umiejętności wyniosę?"
    answer: "Flow agentowy od pomysłu do wdrożenia: grilling (grill-me, grill-with-docs), mapa funkcji (wayfinder), spec z seamami testów (to-spec), małe tickety (to-tickets), implementacja test-first przez subagentów (implement-spec, tdd), code review i PR. Do tego harness dla agenta i jego testy, sekrety poza kodem, CI/CD i model AI w środku narzędzia."
  - question: "Czym jest ten flow agentowy?"
    answer: "To spec-driven development w lekkiej formie. Agent przepytuje Cię i zbiera fakty, Ty podejmujesz decyzje. Z decyzji powstaje spec, ze spec małe tickety, a tickety budują subagenci testami. Wszystko zostaje w repo i w issues, więc każdą funkcję zaczynasz w czystej sesji, a agent wie, co już ustalono. GitHub Issues to tylko miejsce na plan: ważny jest proces."
  - question: "Co budujemy?"
    answer: "Wewnętrzne narzędzie dla zespołu, nie tylko automatyzację: logowanie, baza, API, interfejs i wdrożenie. Budujemy je w trzech krokach: duża funkcja przez pełny flow, mały ticket ze zmianą wymagań przez krótki flow i dodanie AI do narzędzia."
  - question: "Którego agenta AI użyjemy?"
    answer: "Wybierasz: Claude Code, OpenCode albo Codex. Laby testujemy na wszystkich trzech. Stack też wybierasz: Python (FastAPI) albo Go."
  - question: "Czy muszę umieć programować?"
    answer: "Nie musisz być programistą. Wystarczy, że rozumiesz zmienne, pętle, funkcje i prosty endpoint HTTP."
  - question: "Czy muszę coś konfigurować?"
    answer: "Tylko trochę. Przed szkoleniem dostaniesz instrukcję krok po kroku: co zainstalować i jak przygotować środowisko. Środowisko labu przygotowujemy my."

