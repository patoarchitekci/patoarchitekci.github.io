    title: "Duża funkcja: pełny proces"
    description: "Doprecyzowanie, specyfikacja, podział na małe zadania, implementacja z testami, code review i wdrożenie. Pierwszy deploy i logowanie przez Entra ID."
  - number: 6
    title: "Mała zmiana: krótka ścieżka"
    description: "Wymagania zmieniają się w trakcie, jak w pracy. Agent doprecyzowuje zmianę i od razu ją wdraża. Praca równoległa w dwóch sesjach."
  - number: 7
    title: "AI w narzędziu"
    description: "Dodajemy model AI do gotowego narzędzia: structured output, obsługa limitów, koszt. Kiedy AI pomaga, a kiedy wystarczy zwykły kod."
  - number: 8
    title: "Dalej sam"
    description: "Jak zacząć własny projekt tym samym procesem: prompty startowe na opis problemu, stack, jakość i testy."

