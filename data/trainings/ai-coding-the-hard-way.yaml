# Treść
description:
  - "Szkolenie dla adminów, Ops i DevOps, nie dla programistów. Pokazujemy, jak zbudować z agentem AI własne narzędzie dla zespołu: nie tylko skrypt czy automatyzację, ale pełną aplikację z logowaniem, bazą, API i interfejsem, wdrożoną przez pipeline."
  - "Sednem jest flow agentowy. Agent przepytuje Cię jedno pytanie naraz (grill-me, grill-with-docs) i zapisuje opis, stack i zasady w repo. Skill wayfinder rozpisuje aplikację na mapę funkcji z decyzjami do podjęcia. Każda funkcja przechodzi tę samą drogę: rozstrzygnięcie, spec z kontraktami i seamami testów, małe tickety, implementacja przez subagentów test-first, code review zgodności ze spec, PR i merge po zielonym CI."
  - "To spec-driven development w lekkiej, przejrzystej formie. Fakty to praca agenta, decyzje są Twoje. Każda decyzja, spec i słownik pojęć zostają w repo i w issues, więc po miesiącu wiesz, dlaczego kod wygląda tak, a nie inaczej. A agent w nowej sesji wie to samo."
  - "Ćwiczysz dwie ścieżki: dużą funkcję przez pełny flow i mały ticket ze zmianą wymagań w trakcie, przez krótki flow. Na koniec dodajesz AI do gotowego narzędzia. Wychodzisz z wdrożonym narzędziem, repozytorium z harnessem i promptami, którymi zaczniesz własny projekt."
  - "„Wszystko na żywym organizmie: widzisz efekty swojej pracy, napotykasz prawdziwe problemy i uczysz się je rozwiązywać. Polecam gorąco :)” - Jan Szczyra"

