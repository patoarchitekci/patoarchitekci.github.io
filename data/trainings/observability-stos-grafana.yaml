# Treść
description:
  - "Znacie ten dowcip: 'Cisco przelało Splunkowi 150 mln dolarów. Nikt nie wie, czy chcieli ich kupić, czy tylko opłacić swój rachunek'? Wiecie, czemu jest śmieszny? Bo jest prawdziwy - narzędzia do monitorowania są DROGIE. I nie bez powodu. Ale czy muszą być? To zależy."
  - "Grafana Labs udowadnia, że można mieć potężny system monitorowania bez ryzyka bankructwa. To nie jest szkolenie ze stawiania stosu od zera. Środowisko jest gotowe, a my rozbieramy je na części: OpenTelemetry, kolektory, Prometheus, Loki, Tempo i Pyroscope. Zobaczycie, jak działa każdy komponent, do czego służy i jak go używać. Przede wszystkim zrozumiecie, czym jest observability i jak logi, metryki, trace'y i profile składają się w jedną odpowiedź."
  - "Ta edycja jest przebudowana pod pracę z AI. Zapytania w PromQL, LogQL czy TraceQL pisze dziś model, więc nie wkuwamy składni. Skupiamy się na tym, czego model za Was nie zrobi: na jakie pytania odpowiada każdy sygnał, jak czytać zapytania i jak je krytykować."
  - "Kolektory dostają osobny moduł: Alloy vs OpenTelemetry Collector, topologie na Kubernetesie i to, jak kolektor gubi dane po cichu, choć wszystko świeci na zielono."
  - "Na koniec wpinamy agenta AI w observability przez MCP i puszczamy go na prawdziwy incydent. Uczycie się nie tylko z nim pracować, ale też obalać albo potwierdzać jego diagnozę - bo agent mówi pewnie także wtedy, kiedy się myli."
  - "Jak zwykle - nie dla mięczaków :)"

