modules:
  - number: 1
    title: "Dzień 1 · OpenTelemetry: teoria"
    description: "Monitorowanie vs observability, a potem cztery sygnały: logi, metryki, trace'y i profile. Na jakie pytania każdy z nich faktycznie odpowiada i jak OpenTelemetry spina je jednym modelem danych."
  - number: 2
    title: "Dzień 1 · OpenTelemetry: instrumentacja aplikacji"
    description: "Instrumentacja ręczna, automatyczna i eBPF - co daje każda z nich i co po sobie zostawia. Konwencje semantyczne i eksport danych do stosu Grafana. Praktyka: co i jak instrumentować."
  - number: 3
    title: "Dzień 1 · Kolektory"
    description: "Model pipeline'ów, Alloy vs OpenTelemetry Collector, topologie na Kubernetesie, kolejki, retry i pamięć. Jak kolektor gubi dane po cichu, choć wszystko świeci na zielono. Praktyka: pierwszy pipeline, pułapka reloadu, ciche gubienie danych, monitoring."
  - number: 4
    title: "Dzień 1 · Prometheus: metryki"
    description: "Architektura i wynikające z niej ograniczenia, PromQL, service discovery, recording rules, kardynalność, exportery. Teoria i praktyka PromQL."
  - number: 5
    title: "Dzień 1 · Loki: logi"
    description: "Architektura, tryby wdrożenia, etykiety i kardynalność strumieni, structured data, LogQL. Praktyka LogQL na początku dnia 2."
  - number: 6
    title: "Dzień 2 · Tempo: tracing"
    description: "Jak działa distributed tracing, architektura Tempo, TraceQL, integracje z pozostałymi sygnałami. Teoria i praktyka TraceQL."
  - number: 7
    title: "Dzień 2 · Profilowanie"
    description: "Co mierzy profil i kiedy po niego sięgać. Flame graphy w Pyroscope. Teoria i praktyka."
  - number: 8
    title: "Dzień 2 · Grafana Drilldown"
    description: "Eksploracja metryk, logów, trace'ów i profili bez pisania zapytań - i gdzie ta wygoda się kończy. Teoria i praktyka."
  - number: 9
    title: "Dzień 2 · Adnotacje"
    description: "Deploye, zmiany konfiguracji i przełączenia flag jako zdarzenia na tle danych. Teoria i praktyka."
  - number: 10
    title: "Dzień 2 · AI SRE"
    description: "Agent wpięty w observability przez MCP (Grafana, Tempo) na prawdziwym incydencie. Uczymy się nie tylko z nim pracować, ale też obalać albo potwierdzać jego diagnozę. Praktyka: incydent prowadzony przez agenta."
  - number: 11
    title: "Dzień 2 · Funkcje Grafany"
    description: "Funkcje Grafany, które warto znać, a o których mało kto wie. Teoria i praktyka."
