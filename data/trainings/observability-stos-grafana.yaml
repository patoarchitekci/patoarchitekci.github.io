# FAQ
faq:
  - question: "Czy muszę znać Grafanę wcześniej?"
    answer: "Podstawowa znajomość Grafany będzie pomocna, ale nie jest wymagana. Skupiamy się na całym stosie observability."
  - question: "Czy omówimy tylko Open Source narzędzia?"
    answer: "Tak, skupiamy się na stosie Grafana Labs (Loki, Grafana, Tempo, Prometheus/Mimir, Pyroscope) jako alternatywie dla drogich rozwiązań komercyjnych."
  - question: "Czy nauczę się instrumentować aplikacje z Open Telemetry?"
    answer: "Tak - moduł 2 to praktyka instrumentacji: ręczna, automatyczna i eBPF, plus eksport danych do stosu Grafana."
  - question: "Czy to szkolenie pokrywa koszty monitoringu?"
    answer: "Tak. Koszt omawiamy tam, gdzie realnie powstaje - przy kolektorach, kardynalności i retencji."
  - question: "Jakie narzędzia będą zainstalowane w środowisku warsztatowym?"
    answer: "Pełny stos: Loki (logi), Grafana (wizualizacja), Tempo (tracing), Prometheus/Mimir (metryki), Pyroscope, Grafana Alloy jako kolektor. Do modułu AI SRE - serwery MCP dla Grafany i Tempo."

